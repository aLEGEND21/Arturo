name: Deploy

on:
  push:
    branches: [main]

# Never run two deploys at once; queue instead.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compute image tag
        run: echo "TAG=${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - name: Build images
        run: |
          docker build -t "arturo-backend:$TAG" ./backend
          docker build -t "arturo-frontend:$TAG" ./frontend

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          {
            echo "Host vps"
            echo "  HostName ${{ secrets.DEPLOY_HOST }}"
            echo "  User ${{ secrets.DEPLOY_USER }}"
            echo "  IdentityFile ~/.ssh/id_deploy"
            echo "  StrictHostKeyChecking accept-new"
          } > ~/.ssh/config

      - name: Ship images to VPS
        run: docker save "arturo-backend:$TAG" "arturo-frontend:$TAG" | gzip | ssh vps 'gunzip | docker load'

      - name: Deploy
        run: |
          ssh vps 'mkdir -p /opt/arturo'
          scp docker-compose.prod.yml scripts/deploy.sh scripts/rollback.sh vps:/opt/arturo/
          ssh vps "bash /opt/arturo/deploy.sh $TAG"
