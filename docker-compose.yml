services:
  arturo-backend:
    build: ./backend
    container_name: arturo-backend
    restart: unless-stopped
    environment:
      TZ: America/New_York
      ARTURO_DB: /data/arturo.db
    volumes:
      # Bind mount to a real local path — never an overlay layer or network mount (WAL).
      - ./backend/data:/data
    # Not published to the host: only the frontend can reach it.
    expose:
      - "8000"

  arturo-frontend:
    build: ./frontend
    container_name: arturo-frontend
    restart: unless-stopped
    # /api and /health proxy to the backend via rewrites baked in at image
    # build time (see frontend/Dockerfile: API_PROXY_TARGET).
    ports:
      - "3000:3000"
    depends_on:
      - arturo-backend
